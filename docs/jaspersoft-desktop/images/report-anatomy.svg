<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>How data flows through a report</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#062e79"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- the data -->
  <rect x="20" y="40" width="170" height="80" rx="8" fill="#eef3fa" stroke="#9fb4d6"/>
  <text x="105" y="72" text-anchor="middle" font-weight="bold" fill="#062e79">Your data</text>
  <text x="105" y="96" text-anchor="middle" fill="#3b4453">CSV, Excel, JSON,</text>
  <text x="105" y="113" text-anchor="middle" fill="#3b4453">a database…</text>

  <rect x="20" y="170" width="170" height="80" rx="8" fill="#eef3fa" stroke="#9fb4d6"/>
  <text x="105" y="202" text-anchor="middle" font-weight="bold" fill="#062e79">Data adapter</text>
  <text x="105" y="226" text-anchor="middle" fill="#3b4453">where the data is,</text>
  <text x="105" y="243" text-anchor="middle" fill="#3b4453">how to read it (.jrdax)</text>
  <line x1="105" y1="120" x2="105" y2="166" stroke="#062e79" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the dataset -->
  <rect x="250" y="40" width="250" height="210" rx="8" fill="#f4f8f1" stroke="#a9c79a"/>
  <text x="375" y="68" text-anchor="middle" font-weight="bold" fill="#2e5b1e">Dataset</text>
  <text x="270" y="98" fill="#3b4453"><tspan font-weight="bold">Query</tspan> — which records (optional)</text>
  <text x="270" y="126" fill="#3b4453"><tspan font-weight="bold">Filter</tspan> — which to keep</text>
  <text x="270" y="154" fill="#3b4453"><tspan font-weight="bold">Fields</tspan> — $F{amount}</text>
  <text x="290" y="171" fill="#6b7585" font-size="12">one value per record</text>
  <text x="270" y="199" fill="#3b4453"><tspan font-weight="bold">Variables</tspan> — $V{total}</text>
  <text x="290" y="216" fill="#6b7585" font-size="12">computed: sums, counts…</text>
  <line x1="190" y1="210" x2="246" y2="160" stroke="#062e79" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- parameters -->
  <rect x="250" y="300" width="250" height="90" rx="8" fill="#fbf4ea" stroke="#d8b98a"/>
  <text x="375" y="328" text-anchor="middle" font-weight="bold" fill="#7a4e12">Parameters — $P{country}</text>
  <text x="375" y="352" text-anchor="middle" fill="#3b4453">values given when the report runs:</text>
  <text x="375" y="370" text-anchor="middle" fill="#3b4453">asked in the preview, or by an app</text>
  <line x1="375" y1="300" x2="375" y2="254" stroke="#062e79" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the layout -->
  <rect x="560" y="20" width="380" height="390" rx="8" fill="#ffffff" stroke="#9fb4d6"/>
  <text x="750" y="44" text-anchor="middle" font-weight="bold" fill="#062e79">Report: bands</text>
  <g font-size="13">
    <rect x="580" y="58" width="340" height="30" fill="#dfe8f5"/><text x="592" y="78" fill="#062e79">Title</text><text x="908" y="78" text-anchor="end" fill="#6b7585">once</text>
    <rect x="580" y="92" width="340" height="26" fill="#eef3fa"/><text x="592" y="110" fill="#062e79">Page Header</text><text x="908" y="110" text-anchor="end" fill="#6b7585">each page</text>
    <rect x="580" y="122" width="340" height="26" fill="#eef3fa"/><text x="592" y="140" fill="#062e79">Column Header</text><text x="908" y="140" text-anchor="end" fill="#6b7585">each page</text>
    <rect x="580" y="152" width="340" height="30" fill="#e6f1e0"/><text x="592" y="172" fill="#2e5b1e">Group Header country</text><text x="908" y="172" text-anchor="end" fill="#6b7585">each new country</text>
    <rect x="600" y="186" width="320" height="30" fill="#f4f8f1"/><text x="612" y="206" fill="#2e5b1e" font-weight="bold">Detail</text><text x="908" y="206" text-anchor="end" fill="#6b7585">each record</text>
    <rect x="580" y="220" width="340" height="30" fill="#e6f1e0"/><text x="592" y="240" fill="#2e5b1e">Group Footer country</text><text x="908" y="240" text-anchor="end" fill="#6b7585">end of each country</text>
    <rect x="580" y="254" width="340" height="26" fill="#eef3fa"/><text x="592" y="272" fill="#062e79">Column Footer</text><text x="908" y="272" text-anchor="end" fill="#6b7585">each page</text>
    <rect x="580" y="284" width="340" height="26" fill="#eef3fa"/><text x="592" y="302" fill="#062e79">Page Footer</text><text x="908" y="302" text-anchor="end" fill="#6b7585">each page</text>
    <rect x="580" y="314" width="340" height="30" fill="#dfe8f5"/><text x="592" y="334" fill="#062e79">Summary</text><text x="908" y="334" text-anchor="end" fill="#6b7585">once, at the end</text>
  </g>
  <text x="750" y="372" text-anchor="middle" fill="#3b4453" font-size="13">Elements in the bands show text, fields,</text>
  <text x="750" y="390" text-anchor="middle" fill="#3b4453" font-size="13">variables and parameters: $F{…}, $V{…}, $P{…}</text>
  <line x1="500" y1="150" x2="556" y2="150" stroke="#062e79" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
